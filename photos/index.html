<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>adamwritesblog</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../favicon.ico">
</head>
<body>
    <div id="header-container">
    </div>
    <div id="content-container">
        <hr style="height:1px;background-color:black;border-width:0;">            
        <div id="main-container">
            <h1>photo gallery</h1>
            
            <div class="gallery-title-container">
                <h2>台灣</h2>
            </div>
            <div class="thumbnail-container">
                <div class="thumbnail">
                    <img src="老街/thumbnail.jpeg" class="thumbnail-image" data-size="10" data-filename=".jpeg">
                    <h2 class="thumbnail-title">老街</h2>
                </div>
                <div class="thumbnail">
                    <img src="台北地下街/thumbnail.jpeg" class="thumbnail-image" data-size="4" data-filename=".jpeg">
                    <h2 class="thumbnail-title">台北地下街</h2>
                </div>
                <div class="thumbnail">
                    <img src="日出與夕陽/thumbnail.jpeg" class="thumbnail-image" data-size="8" data-filename=".jpeg">
                    <h2 class="thumbnail-title">日出與夕陽</h2>
                </div>
            </div>

            <div class="gallery-title-container">
                <h2>New England</h2>
            </div>
            <div class="thumbnail-container">
                <div class="thumbnail">
                    <img src="north_conway/thumbnail.jpeg" class="thumbnail-image" data-size="4" data-filename=".jpeg">
                    <h2 class="thumbnail-title">North Conway</h2>
                </div>
            </div>

            <div class="gallery-title-container">
                <h2>Canadian Rockies</h2>
            </div>
            <div class="thumbnail-container">
                <div class="thumbnail">
                    <img src="banff/thumbnail.jpeg" class="thumbnail-image" data-size="26" data-filename=".jpeg">
                    <h2 class="thumbnail-title">Banff</h2>
                </div>
                <div class="thumbnail">
                    <img src="jasper/thumbnail.jpeg" class="thumbnail-image" data-size="8" data-filename=".jpeg">
                    <h2 class="thumbnail-title">Jasper</h2>
                </div>
            </div>

            <div class="gallery-title-container">
                <h2>Europe</h2>
            </div>
            <div class="thumbnail-container">
                <div class="thumbnail">
                    <img src="paris/thumbnail.jpeg" class="thumbnail-image" data-size="9" data-filename=".jpeg">
                    <h2 class="thumbnail-title">Paris</h2>
                </div>
                <div class="thumbnail">
                    <img src="london/thumbnail.jpeg" class="thumbnail-image" data-size="14" data-filename=".jpeg">
                    <h2 class="thumbnail-title">London</h2>
                </div>
                <div class="thumbnail">
                    <img src="azores/thumbnail.jpeg" class="thumbnail-image" data-size="9" data-filename=".jpeg">
                    <h2 class="thumbnail-title">The Azores</h2>
                </div>
            </div>
        </div>
    </div>
    <script src="../header.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
